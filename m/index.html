<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirakara Player - 手机端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; min-height: 100dvh;
            background: #09090b;
            color: #a1a1aa;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px;
        }
        .card {
            max-width: 320px;
        }
        .logo {
            width: 64px; height: 64px; margin: 0 auto 16px;
        }
        .logo img {
            width: 100%; height: 100%; object-fit: contain;
        }
        h1 {
            font-size: 20px; font-weight: 800; color: #e4e4e7;
            letter-spacing: -0.5px; margin-bottom: 8px;
        }
        p {
            font-size: 14px; line-height: 1.6; color: #71717a;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><img src="../images/logo.png" alt="Logo"></div>
        <h1>Kirakara Player</h1>
        <p>手机端正在适配中，请使用电脑访问以获得完整体验。</p>
        <p style="margin-top:8px;font-size:12px;">Mobile version is under development.<br>Please visit on desktop.</p>
    </div>
</body>
</html>
