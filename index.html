                                                    <span className="text-zinc-500">%</span>
                                                </div>}
                                            </div>
                                        );
                                    })}
                                    {activeRoles.size > 0 && <div className="grid grid-cols-3 gap-2">
                                        {[['外显前缀','roleLabelPrefix'],['分隔符','roleLabelSeparator'],['外显后缀','roleLabelSuffix']].map(([l,k])=>(
                                            <div key={k}><span className="text-[9px] text-zinc-500">{l}</span><input type="text" value={config[k]||''} placeholder="可留空" onChange={e=>setConfig({...config,[k]:e.target.value})} className="w-full bg-zinc-800 rounded p-1.5 text-center text-[10px] border border-zinc-700 placeholder:text-zinc-600"/></div>
                                        ))}
                                    </div>}
                                </section>

                                {/* 淡入淡出 */}
                                <section className="space-y-2 pt-3 border-t border-zinc-800">
                                    <label className="text-[10px] font-bold text-zinc-500 uppercase flex items-center gap-2 tracking-widest"><Icons.Blur className="w-3 h-3"/> 淡入淡出</label>
                                    <label className="flex items-center gap-2 bg-zinc-800 rounded p-1.5 cursor-pointer"><input type="checkbox" checked={config.fadeEnabled} onChange={e=>setConfig({...config,fadeEnabled:e.target.checked})} className="accent-indigo-500 w-3.5 h-3.5"/><span className="text-[10px] text-zinc-300">启用淡入淡出</span></label>
                                    {config.fadeEnabled&&<div className="space-y-2 ml-2">
                                        <label className="flex items-center gap-2 bg-zinc-800/50 rounded p-1.5 cursor-pointer"><input type="checkbox" checked={config.fadeParagraphOnly} onChange={e=>setConfig({...config,fadeParagraphOnly:e.target.checked})} className="accent-indigo-500 w-3 h-3"/><span className="text-[10px] text-zinc-400">仅段落首尾</span></label>
                                        <div className="flex items-center gap-2"><span className="text-[10px] text-zinc-500">时长</span><input type="number" value={config.fadeDurationMs} min="0" onChange={e=>{const r=e.target.value;setConfig({...config,fadeDurationMs:r===''?'':parseInt(r)||100})}} onBlur={()=>{if(config.fadeDurationMs==='')setConfig({...config,fadeDurationMs:100})}} className="w-20 bg-zinc-800 rounded p-1 text-center text-[10px] border border-zinc-700"/><span className="text-[10px] text-zinc-600">ms</span></div>
                                    </div>}
                                </section>

                                {/* 指示灯 */}
                                <section className="space-y-2 pt-3 border-t border-zinc-800">
                                    <label className="text-[10px] font-bold text-zinc-500 uppercase flex items-center gap-2 tracking-widest"><Icons.Clock className="w-3 h-3"/> 指示灯</label>
                                    <label className="flex items-center gap-2 bg-zinc-800 rounded p-1.5 cursor-pointer"><input type="checkbox" checked={config.indicatorEnabled} onChange={e=>setConfig({...config,indicatorEnabled:e.target.checked})} className="accent-emerald-500 w-3.5 h-3.5"/><span className="text-[10px] text-zinc-300">启用指示灯</span></label>
                                    {config.indicatorEnabled&&<div className="space-y-2 ml-2">
                                        <div className="grid grid-cols-2 gap-2">
                                            {[['持续时间(s)','indicatorDuration',2,.1,.1],['淡出占比','indicatorFadeRatio',0,.1,0],['大小(px)','indicatorSize',6,1,5],['间距(px)','indicatorSpacing',2,1],['描边粗细','indicatorStrokeWidth',0,1,0]].map(([l,k,fb,st,mn])=>(
                                                <div key={k}><span className="text-[9px] text-zinc-500">{l}</span><input type="number" value={config[k]} step={st||1} min={mn!=null?mn:''} onChange={e=>{const r=e.target.value;setConfig({...config,[k]:r===''?'':(st?parseFloat:parseInt)(r)||fb})}} onBlur={()=>{if(config[k]===''||(mn!=null&&config[k]<mn))setConfig({...config,[k]:mn!=null?mn:0})}} className="w-full bg-zinc-800 rounded p-1.5 text-center text-[10px] border border-zinc-700"/></div>
                                            ))}
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[['主体色','indicatorFillColor'],['描边色','indicatorStrokeColor']].map(([l,k])=>(
                                                <div key={k} className="flex flex-col items-center gap-0.5"><span className="text-[8px] text-zinc-500">{l}</span><input type="color" value={config[k]} onChange={e=>setConfig({...config,[k]:e.target.value})} className="w-full h-6 rounded bg-zinc-800 cursor-pointer border border-zinc-700"/></div>
                                            ))}
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[['X偏移','indicatorOffsetX',0],['Y偏移','indicatorOffsetY',0]].map(([l,k,fb])=>(
                                                <div key={k}><span className="text-[9px] text-zinc-500">{l}</span><input type="number" value={config[k]} onChange={e=>{const r=e.target.value;setConfig({...config,[k]:r===''?'':parseInt(r)||fb})}} onBlur={()=>{if(config[k]==='')setConfig({...config,[k]:0})}} className="w-full bg-zinc-800 rounded p-1.5 text-center text-[10px] border border-zinc-700"/></div>
                                            ))}
                                        </div>
                                    </div>}
                                </section>

                                {/* 布局 */}
                                <section className="space-y-2 pt-3 border-t border-zinc-800">
                                    <label className="text-[10px] font-bold text-zinc-500 uppercase flex items-center gap-2 tracking-widest"><Icons.Caption className="w-3 h-3"/> 字幕布局</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[['行1 X','line1X',0],['行1 Y','line1Y',0],['行2 X','line2Right',0],['行2 Y','line2Y',0]].map(([l,k,fb])=>(
                                            <div key={k}><span className="text-[9px] text-zinc-500">{l}</span><input type="number" value={config[k]} onChange={e=>{const r=e.target.value;setConfig({...config,[k]:r===''?'':parseInt(r)||fb})}} onBlur={()=>{if(config[k]===''||config[k]<0)setConfig({...config,[k]:0})}} className="w-full bg-zinc-800 rounded p-1.5 text-center text-[10px] border border-zinc-700"/></div>
                                        ))}
                                    </div>
                                </section>

                                </>:<SongTitleSettings config={config} setConfig={setConfig} backgroundImageUrl={titleBackgroundUrl} onBackgroundFile={selectTitleBackground} onClearBackground={clearTitleBackground}/>}

                                {/* 项目管理 */}
                                <section className="space-y-2 pt-3 border-t border-zinc-800">
                                    <label className="text-[10px] font-bold text-zinc-500 uppercase flex items-center gap-2 tracking-widest"><Icons.FolderOpen className="w-3 h-3"/> 项目管理</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input ref={krlImportRef} type="file" accept=".krl" className="hidden" onChange={e=>{const f=e.target.files[0];if(f){importKrl(f);e.target.value='';}}}/>
                                        <button className="flex items-center justify-center gap-1 text-[10px] text-indigo-400 hover:text-indigo-300 border border-zinc-700 rounded px-2 py-1.5" onClick={()=>krlImportRef.current?.click()}><Icons.FolderOpen className="w-3 h-3"/>导入</button>
                                        <div className="relative" onMouseEnter={()=>{clearTimeout(exportLeaveRef.current);setExportMenuOpen(true);}} onMouseLeave={()=>{exportLeaveRef.current=setTimeout(()=>setExportMenuOpen(false),200);}}>
                                            <button className="w-full flex items-center justify-center gap-1 text-[10px] text-amber-400 hover:text-amber-300 border border-zinc-700 rounded px-2 py-1.5" onClick={exportAsProject}><Icons.Save className="w-3 h-3"/>导出为工程</button>
                                            {exportMenuOpen && (
                                                <div className="absolute bottom-full left-0 mb-1 w-full bg-zinc-800 border border-zinc-700 rounded shadow-lg overflow-hidden z-10" onMouseEnter={()=>clearTimeout(exportLeaveRef.current)} onMouseLeave={()=>setExportMenuOpen(false)}>
                                                    <button className="flex items-center gap-1 w-full text-left text-[10px] text-zinc-400 hover:bg-zinc-700 px-2 py-1.5" onClick={(e)=>{e.stopPropagation();exportAsTemplate();setExportMenuOpen(false);}}><Icons.Save className="w-3 h-3"/>仅导出模板</button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <button onClick={()=>setShowResetConfirm(true)} className="w-full bg-zinc-800 hover:bg-red-900/30 text-[10px] text-zinc-500 hover:text-red-400 py-1.5 rounded border border-zinc-700 hover:border-red-800 transition-colors">重置全部设定</button>
                                </section>
                            </div>
                        </div>

                        <div className="preview-pane flex-1 flex flex-col items-center justify-center p-4 bg-zinc-950 relative min-w-0" ref={previewOuterRef}>
                            <div className="preview-frame" style={{width:1280*canvasScale,height:720*canvasScale,position:'relative',flexShrink:0}}>
                            <div className="preview-stage" style={{ width:1280, height:720, backgroundColor:'#000', outline:'2px solid #27272a', transform:`scale(${canvasScale})`, transformOrigin:'top left', position:'relative', overflow:'hidden', flexShrink:0 }}>
                                {bgImageEnabled && bgImageUrl && !videoUrl && (<><img src={bgImageUrl} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',filter:'blur(20px) brightness(0.4)'}}/><img src={bgImageUrl} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'contain',opacity:config.bgImageOpacity??1}}/></>)}
                                {!videoUrl && !bgImageEnabled && <div style={{position:'absolute',inset:0,backgroundColor:config.bgColor}}/>}
                                {videoUrl && <video key={videoUrl} ref={videoRef} src={videoUrl} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'contain'}} muted playsInline/>}
                                <SongTitleLayer config={config} currentTime={time} backgroundImageUrl={titleBackgroundUrl}/>
                                {(prependDuration<=0||time>=0)&&activeLines.l1 && <div className="absolute flex items-end" style={{left:config.line1X,top:config.line1Y}}><LyricLine line={activeLines.l1} config={config} currentTime={time}/></div>}
                                {(prependDuration<=0||time>=0)&&activeLines.l2 && <div className="absolute flex items-end" style={{right:config.line2Right,top:getLine2Y(config)}}><LyricLine line={activeLines.l2} config={config} currentTime={time}/></div>}
                            </div>
                            </div>
                            <div className="player-controls mt-4 w-full max-w-3xl bg-zinc-900/80 backdrop-blur p-5 rounded-3xl border border-zinc-800 flex items-center gap-6 shadow-xl">
                                <button aria-label={isPlaying?'暂停':'播放'} data-testid="playback-toggle" onClick={()=>{if(isPlaying)pausePlayback();else beginPlayback();}} className="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center hover:bg-indigo-500 transition-all active:scale-95">
                                    {isPlaying?<Icons.Pause className="w-6 h-6 fill-white text-white"/>:<Icons.Play className="w-6 h-6 ml-1 fill-white text-white"/>}
                                </button>
                                <div className="flex-1 space-y-2">
                                    <div className="flex justify-between font-mono text-[10px] text-zinc-500 font-bold">
                                        <span className="text-indigo-400">{formatTimelineTime(time)}</span>
                                        <span>{formatTimelineTime(duration,false)}</span>
                                    </div>
                                    <input aria-label="播放时间轴" data-testid="timeline-slider" type="range" min={timelineMin} max={duration||0} step="0.001" value={time} onChange={e=>seekTimeline(parseFloat(e.target.value))} className="w-full accent-indigo-500 h-1.5 cursor-pointer bg-zinc-800 rounded-lg appearance-none"/>
                                </div>
                            </div>
                            {exporting && <div className="export-overlay">
                                <div className="text-xs font-bold text-white mb-1.5 flex justify-between"><span>🎬 导出中 {expProgress}%</span>{expEta&&<span className="text-zinc-400 font-normal">{expEta}</span>}</div>
                                <div className="w-full bg-zinc-700 rounded-full h-2 overflow-hidden mb-3"><div className="bg-indigo-500 h-full rounded-full transition-all duration-300" style={{width:`${expProgress}%`}}/></div>
                                <button className="w-full text-xs text-zinc-400 hover:text-red-400 border border-zinc-700 hover:border-red-800 rounded-lg py-1.5 transition-colors" onClick={()=>{cancelRef.current=true;}}>✕ 取消导出</button>
                            </div>}
                        </div>
                        {!exporting && <button className={`export-fab${(duration>0||audioUrl)?'':' disabled'}`} title={duration>0||audioUrl?'导出视频':'请先加载音频或视频'} disabled={!(duration>0||audioUrl)} onClick={()=>{setShowExportModal(true);checkAacSupport().then(ok=>{setAacOk(ok);if(!ok&&audioUrl&&expFormat==='mp4'){setExpFormat('webm');setExpCodec('vp9');}});}}>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </button>}
                        {showExportModal && <div className="export-modal-backdrop" onClick={e=>{if(e.target===e.currentTarget)setShowExportModal(false)}}>
                            <div className="export-modal"><h2>🎬 导出视频</h2>
                                <div className="space-y-3" style={{marginTop:12}}>
                                    <div className="text-s text-zinc-400 font-semibold">视频设置</div>
                                    {!aacOk && audioUrl && expFormat !== 'png-seq' && <div className="text-[10px] text-amber-400">当前浏览器不支持 AAC 音频编码，无法使用 MP4 格式导出</div>}
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label>容器格式</label><select value={expFormat} onChange={e=>{setExpFormat(e.target.value);setExpCodec(e.target.value==='mp4'?'h264':'vp9');}}><option value="mp4" disabled={!aacOk && audioUrl}>MP4</option><option value="webm">WebM</option><option value="png-seq">MOV</option></select></div>
                                        <div><label>视频编码</label>{expFormat==='png-seq'?<select value="png" disabled><option value="png">透明背景PNG</option></select>:<select value={expCodec} onChange={e=>setExpCodec(e.target.value)}>{expFormat==='mp4'?<><option value="h264">H.264</option></>:<><option value="vp9">VP9</option><option value="vp8">VP8</option></>}</select>}</div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label>分辨率</label><div className="flex items-center gap-1"><input type="number" value={expW} onChange={e=>{const r=e.target.value;setExpW(r===''?'':parseInt(r)||1920)}} onBlur={()=>{if(expW===''||expW<0)setExpW(1920)}} className="flex-1"/><span className="text-zinc-500">×</span><input type="number" value={expH} onChange={e=>{const r=e.target.value;setExpH(r===''?'':parseInt(r)||1080)}} onBlur={()=>{if(expH===''||expH<0)setExpH(1080)}} className="flex-1"/></div></div>
                                        <div><label>帧率 (FPS)</label><input type="number" value={expFps} onChange={e=>{const r=e.target.value;setExpFps(r===''?'':parseInt(r)||60)}} onBlur={()=>{if(expFps===''||expFps<0)setExpFps(60)}}/></div>
                                    </div>
                                    {audioUrl && expFormat !== 'png-seq' && <>
                                    <div className="text-s text-zinc-400 font-semibold">音频设置</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label>采样率</label><select value={expAudioSampleRate} onChange={e=>setExpAudioSampleRate(parseInt(e.target.value))}><option value={48000}>48000Hz</option><option value={44100}>44100Hz</option></select></div>
                                        <div><label>比特率</label><select value={expAudioBitrate} onChange={e=>setExpAudioBitrate(parseInt(e.target.value))}><option value={192}>192k</option><option value={128}>128k</option><option value={256}>256k</option></select></div>
                                    </div></>}
                                </div>
                                <div className="btn-row"><button className="btn btn-ghost" onClick={()=>setShowExportModal(false)}>取消</button><button className="btn btn-primary" onClick={doExport}>开始导出</button></div>
                                <div className="export-tips mt-3 text-xs text-zinc-400">{expFormat==='mp4'?'':''}</div>
                            </div>
                        </div>}
                        {showResetConfirm && <div className="export-modal-backdrop" onClick={e=>{if(e.target===e.currentTarget)setShowResetConfirm(false)}}>
                            <div className="export-modal"><h2>重置全部设定</h2>
                                <div className="text-xs text-zinc-300 leading-relaxed" style={{marginBottom:16}}>确定要重置所有样式设定吗？<br/>字体、颜色、角色配置等将全部恢复为默认值，此操作不可撤销。</div>
                                <div className="btn-row"><button className="btn btn-ghost" onClick={()=>setShowResetConfirm(false)}>取消</button><button className="btn btn-primary" style={{background:'#dc2626'}} onClick={()=>{setConfig(normalizeConfig({}));try{localStorage.removeItem(STORAGE_KEY);}catch(_){};setShowResetConfirm(false);}}>确定</button></div>
                            </div>
                        </div>}
                        {showAllRoles && <div className="export-modal-backdrop" onClick={e=>{if(e.target===e.currentTarget)setShowAllRoles(false)}}>
                            <div className="roles-modal"><h2>🎨 全部角色配置</h2>
                                <div className="roles-row" style={{marginBottom:14}}>
                                    <input type="text" placeholder="新角色名（如 pink）…" id="new-role-input" style={{flex:1}}
                                        onKeyDown={e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v&&!(config.characterProfiles||{})[v]){setConfig({...config,characterProfiles:{...(config.characterProfiles||{}),[v]:{}}});e.target.value='';}}}} />
                                    <button className="btn btn-primary" style={{padding:'6px 16px',fontSize:12}}
                                        onClick={()=>{const inp=document.getElementById('new-role-input');const v=inp?.value?.trim();if(v&&!(config.characterProfiles||{})[v]){setConfig({...config,characterProfiles:{...(config.characterProfiles||{}),[v]:{}}});inp.value='';}}}>
                                        添加
                                    </button>
                                </div>
                                <div className="roles-scroll" style={{maxHeight:'55vh',overflowY:'auto',paddingRight:4}}>
                                    {Object.keys(config.characterProfiles||{}).length===0 && <div style={{textAlign:'center',color:'#71717a',fontSize:12,padding:20}}>暂无角色，上方输入添加</div>}
                                    {Object.entries(config.characterProfiles||{}).map(([roleName, profile]) => {
                                        const p = profile || {};
                                        const isActive = activeRoles.has(roleName);
                                        const updateRole = (patch) => setConfig({...config, characterProfiles:{...config.characterProfiles, [roleName]:{...p, ...patch}}});
                                        const delRole = () => { const np = {...config.characterProfiles}; delete np[roleName]; setConfig({...config, characterProfiles:np}); };
                                        const useImage = !!p.imageMode;
                                        return (
                                            <div key={roleName} className={`roles-card${isActive?'':' inactive'}`}>
                                                <div className="roles-card-header">
                                                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                                                        <span className="roles-card-title" style={{color:p.displayColor||p.colorBefore||config.colorBefore}}>{roleName}</span>
                                                        <label style={{display:'flex',alignItems:'center',gap:3,cursor:'pointer',fontSize:10,color:'#a1a1aa'}}>
                                                            <input type="checkbox" checked={!!p.showLabel} onChange={e => updateRole({ showLabel: e.target.checked || undefined })} /> 外显
                                                        </label>
                                                        <span className={`roles-badge${isActive?' active':' inactive'}`}>{isActive ? '歌词中' : '未使用'}</span>
                                                    </div>
                                                    {!isActive && <button className="btn-del" onClick={delRole}>✕ 删除</button>}
                                                </div>
                                                <div className="roles-row">
                                                    <button className={`chip${!useImage?' on':' off'}`} onClick={()=>updateRole({imageMode:undefined})}>文字</button>
                                                    <button className={`chip${useImage?' on':' off'}`} onClick={()=>updateRole({imageMode:true})}>图片</button>
                                                    {useImage
                                                        ? <div style={{display:'flex',alignItems:'center',gap:5,flex:1,background:'#27272a',border:'1px solid #3f3f46',borderRadius:6,padding:'2px 6px'}}>
                                                            <input type="file" accept="image/*" style={{display:'none'}} id={`all-img-file-${roleName}`}
                                                                onChange={e=>{const f=e.target.files[0];if(f)selectRoleImage(roleName,f);e.target.value='';}} />
                                                            <button className="chip off" style={{padding:'2px 6px',fontSize:10}}
                                                                onClick={()=>document.getElementById(`all-img-file-${roleName}`)?.click()}>📁 选择</button>
                                                            <span style={{fontSize:10,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:p.image?'#d4d4d8':'#71717a'}}>{p.imageName || (p.image ? '已选图' : '未选择')}</span>
                                                            {p.image && <button className="btn-del" onClick={()=>clearRoleImage(roleName)}>✕</button>}
                                                        </div>
                                                        : <div style={{display:'flex',alignItems:'center',gap:4,flex:1}}>
                                                            <label>外显名</label>
                                                            <input type="text" value={p.displayName || ''} placeholder={roleName} style={{flex:1,minWidth:80}}
                                                                onChange={e => updateRole({ displayName: e.target.value })} />
                                                        </div>
                                                    }
                                                </div>
                                                <div className="roles-grid4">
                                                    {[['走字前','colorBefore'],['走字后','colorAfter'],['描边前','strokeColorBefore'],['描边后','strokeColorAfter']].map(([l,k]) =>
                                                        <div key={k}><label>{l}</label>
                                                            <input type="color" value={p[k] || config[k]}
                                                                onChange={e => updateRole({ [k]: e.target.value })} />
                                                        </div>
                                                    )}
                                                </div>
                                                {!useImage && <div className="roles-row">
                                                    <label>标签色</label><input type="color" value={p.displayColor||p.colorBefore||config.colorBefore} onChange={e=>updateRole({displayColor:e.target.value})} style={{width:36,height:24}} />
                                                    <label>标签描边</label><input type="color" value={p.labelStrokeColor||config.strokeColorBefore} onChange={e=>updateRole({labelStrokeColor:e.target.value})} style={{width:36,height:24}} />
                                                    <label>缩放%</label><input type="number" value={p.labelScale??100} step="5" min="10" max="300" style={{width:56}}
                                                        onChange={e=>{const r=e.target.value;updateRole({labelScale:r===''?'':parseInt(r)||100})}} onBlur={()=>{if(p.labelScale===''||p.labelScale<10)updateRole({labelScale:10})}} />
                                                </div>}
                                                {useImage && <div className="roles-row">
                                                    <label>Y偏移</label><input type="number" value={p.imageOffsetY||''} placeholder="0" step="1" style={{width:50}}
                                                        onChange={e=>{const r=e.target.value;updateRole({imageOffsetY:r===''?'':parseInt(r)||undefined})}} onBlur={()=>{if(p.imageOffsetY===''||p.imageOffsetY==null||isNaN(p.imageOffsetY))updateRole({imageOffsetY:0})}} />
                                                    <label>缩放%</label><input type="number" value={p.labelScale??100} step="5" min="10" max="300" style={{width:56}}
                                                        onChange={e=>{const r=e.target.value;updateRole({labelScale:r===''?'':parseInt(r)||100})}} onBlur={()=>{if(p.labelScale===''||p.labelScale<10)updateRole({labelScale:10})}} />
                                                    <label>左距</label><input type="number" value={p.labelMarginLeft||''} placeholder="0" step="1" style={{width:50}}
                                                        onChange={e=>{const r=e.target.value;updateRole({labelMarginLeft:r===''?'':parseInt(r)||undefined})}} onBlur={()=>{if(p.labelMarginLeft===''||p.labelMarginLeft==null||isNaN(p.labelMarginLeft))updateRole({labelMarginLeft:0})}} />
                                                    <label>右距</label><input type="number" value={p.labelMarginRight||''} placeholder="0" step="1" style={{width:50}}
                                                        onChange={e=>{const r=e.target.value;updateRole({labelMarginRight:r===''?'':parseInt(r)||undefined})}} onBlur={()=>{if(p.labelMarginRight===''||p.labelMarginRight==null||isNaN(p.labelMarginRight))updateRole({labelMarginRight:0})}} />
                                                </div>}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="btn-row" style={{marginTop:12}}><button className="btn btn-ghost" onClick={()=>setShowAllRoles(false)}>关闭</button></div>
                            </div>
                        </div>}
                    </div>
                    {/* key 强制 React 在 URL 变化时销毁旧元素、创建新元素，彻底避免媒体元素内部状态残留 */}
                    <audio key={audioUrl || 'no-audio'} ref={audioRef} src={audioUrl || undefined} onDurationChange={e=>setDuration(e.target.duration)} onPlay={()=>setIsPlaying(true)} onPause={()=>{if(!preludeClockRef.current.playing)setIsPlaying(false)}} onEnded={()=>setIsPlaying(false)}/>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <!-- ==================== 公告 ==================== -->
    <script>
    (function () {
        var ANNOUNCE_KEY = 'kira-announce-role-at-v1.02';
        try { if (localStorage.getItem(ANNOUNCE_KEY)) return; } catch (_) { return; }
        var content =
            '<h2>📢 角色标签更新公告</h2>' +
            '<div style="font-size:13px;line-height:1.7;color:#d4d4d8">' +
                '<p style="margin:0 0 10px">因作者这个笨喵现在才发现角色标签的解析方式存在较大歧义，</br>故从即日起，歌词内的<b>角色标签解析方式将变更为 <code>【@角色】</code></b>，如：</p>' +
                '<p style="margin:0 0 8px">• 单角色：<code>【@絵名】</code></p>' +
                '<p style="margin:0 0 8px">• 多角色：<code>【@絵名+瑞希】</code></p>' +
                '<p style="margin:0 0 8px">• <code>【角色】</code> 将不再作为角色标签解析</p>' +
                '<p style="margin:0 0 8px">如需继续使用角色分色功能，请将已有歌词的 <code>【角色】</code> 替换为 <code>【@角色】</code></p>' +
                '<p style="margin:0 0 8px">或者点击 <a href="tools/convert-roles.html" target="_blank" style="color:#cba6f7">这里</a>将旧标签转换为新标签。</p>' +
                '<p style="margin:0 0 8px">在八月底发布的 SUG 新版将会支持新的标签格式</p>' +
                '<p style="margin:0 0 8px">如有不便还请多多谅解的喵T^T</p>' +
            '</div>' +
            '<div class="btn-row" style="margin-top:16px">' +
                '<button class="btn btn-primary" style="flex:1">知道了</button>' +
            '</div>';
        var backdrop = document.createElement('div');
        backdrop.className = 'export-modal-backdrop';
        backdrop.style.zIndex = '100002';
        var modal = document.createElement('div');
        modal.className = 'export-modal';
        modal.innerHTML = content;
        backdrop.appendChild(modal);
        function close() {
            try { localStorage.setItem(ANNOUNCE_KEY, '1'); } catch (_) {}
            if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
        }
        backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
        modal.querySelector('button').addEventListener('click', close);
        document.body.appendChild(backdrop);
    })();
    </script>
</body>
</html>
