<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirakara Player Demo</title>
    <script>
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <!-- ===== 外部依赖 ===== -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/mp4box@0.5.2/dist/mp4box.all.min.js"></script>

    <!-- ===== 底层共享模块 ===== -->
    <script src="js/shared/config.js"></script>
    <script src="js/shared/measure.js"></script>
    <script src="js/shared/progress.js"></script>

    <!-- ===== 逻辑模块 ===== -->
    <script src="js/parser.js"></script>
    <script src="js/muxer.js"></script>
    <script src="js/codec.js"></script>

    <!-- ===== 渲染引擎 ===== -->
    <script src="js/dom-renderer.js"></script>
    <script src="js/canvas-renderer.js"></script>

    <!-- ===== 导出流水线 分层架构 ===== -->
    <script src="js/export/muxer.js"></script>
    <script src="js/export/container-reader.js"></script>
    <script src="js/export/decoder-provider.js"></script>
    <script src="js/export/renderer.js"></script>
    <script src="js/export/encoder.js"></script>
    <script src="js/export/audio-encoder.js"></script>
    <script src="js/exporter.js"></script>

    <!-- ===== Babel（JSX 转译） ===== -->
    <script src="https://unpkg.com/@babel/standalone@7.29.6/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ==================== SVG 图标 ====================
        const Icons = {
            Play: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polygon points="5 3 19 12 5 21 5 3"/></svg>),
            Pause: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>),
            Settings: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>),
            Music: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>),
            Type: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>),
            Palette: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a3 3 0 1 1 3-3h1.5c1.5 0 2.703-1.372 1.875-2.812-.312-.571-.973-.999-1.648-.999H12z"/></svg>),
            Image: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>),
            Blur: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>),
            Clock: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>),
            Caption: (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 12h2"/><path d="M11 12h5"/><path d="M7 16h2"/><path d="M11 16h5"/></svg>),
        };

        // ==================== 主应用 ====================
        const App = () => {
            const [lrcRaw, setLrcRaw] = useState('');
            const [time, setTime] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [duration, setDuration] = useState(0);
            const [audioUrl, setAudioUrl] = useState(null);
            const [videoUrl, setVideoUrl] = useState(null);
            const [bgImageUrl, setBgImageUrl] = useState(null);
            const [bgImageEnabled, setBgImageEnabled] = useState(false);
            const bgImageInputRef = useRef(null);
            const lrcFileInputRef = useRef(null);
            const [config, setConfig] = useState(() => {
                try { const s = localStorage.getItem(STORAGE_KEY); if (s) { const parsed = JSON.parse(s); /* 清除旧 blob URL */ if (parsed.characterProfiles) for (const k in parsed.characterProfiles) { const p = parsed.characterProfiles[k]; if (p.image && p.image.startsWith('blob:')) { p.image = undefined; p.imageName = undefined; } } return normalizeConfig(parsed); } } catch (_) {}
                return CONFIG_DEFAULTS;
            });
            useEffect(() => { try { /* 持久化前剥离 blob URL */ const save = JSON.parse(JSON.stringify(config)); delete save.line2Bottom; if (save.characterProfiles) for (const k in save.characterProfiles) { const p = save.characterProfiles[k]; if (p.image && p.image.startsWith('blob:')) { p.image = undefined; p.imageName = undefined; } } localStorage.setItem(STORAGE_KEY, JSON.stringify(save)); } catch (_) {} }, [config]);

            const [showExportModal, setShowExportModal] = useState(false);
            const [expW, setExpW] = useState(1920);
            const [expH, setExpH] = useState(1080);
            const [expFps, setExpFps] = useState(60);
            const [expCodec, setExpCodec] = useState('h264');
            const [expFormat, setExpFormat] = useState('mp4');
            const [expAudioBitrate, setExpAudioBitrate] = useState(192);
            const [expAudioSampleRate, setExpAudioSampleRate] = useState(48000);
            const [exporting, setExporting] = useState(false);
            const [expProgress, setExpProgress] = useState(0);
            const [expEta, setExpEta] = useState('');
            const [showAllRoles, setShowAllRoles] = useState(false);
            const cancelRef = useRef(false);

            const exportCtxRef = useRef({ parsedData: [], config: CONFIG_DEFAULTS, entryBuf: ENTRY_BUF });
            useEffect(() => { exportCtxRef.current = { parsedData, config, entryBuf }; }, [parsedData, config, entryBuf]);

            const entryBuf = useMemo(() => getEntryBuf(config), [config.indicatorEnabled, config.indicatorDuration, config.fadeDurationMs]);
            const parsedData = useMemo(() => parseLyrics(lrcRaw, entryBuf, config), [lrcRaw, entryBuf, config.indicatorEnabled]);

            // 歌词中实际出现的角色名集合
            const activeRoles = useMemo(() => {
                const s = new Set();
                if (!parsedData) return s;
                for (const line of parsedData) {
                    for (const c of line.chars) {
                        if (c.roles) for (const r of c.roles) s.add(r);
                    }
                }
                return s;
            }, [parsedData]);

            // 自动检测歌词中的角色，填充到 characterProfiles（不覆盖已有手动配置）
            useEffect(() => {
                if (activeRoles.size === 0) return;
                setConfig(prev => {
                    const profiles = { ...prev.characterProfiles };
                    let changed = false;
                    for (const role of activeRoles) {
                        if (!(role in profiles)) { profiles[role] = {}; changed = true; }
                    }
                    return changed ? { ...prev, characterProfiles: profiles } : prev;
                });
            }, [activeRoles]);

            const activeLines = useMemo(() => {
                let l1 = null, l2 = null, l1P = -1, l2P = -1, l1W = false, l2W = false;
                for (let i = 0; i < parsedData.length; i++) {
                    const line = parsedData[i];
                    const inW = time >= (line.entryTime ?? line.startTime - entryBuf) && time <= line.endTime + EXIT_BUF;
                    if (!inW) continue;
                    if (line.lineInParagraph % 2 === 0) {
                        if (line.paragraph !== l1P) { l1 = line; l1P = line.paragraph; l1W = time < (line.walkDoneTime ?? line.endTime); }
                        else if (!l1W) { l1 = line; l1W = time < (line.walkDoneTime ?? line.endTime); }
                    } else {
                        if (line.paragraph !== l2P) { l2 = line; l2P = line.paragraph; l2W = time < (line.walkDoneTime ?? line.endTime); }
                        else if (!l2W) { l2 = line; l2W = time < (line.walkDoneTime ?? line.endTime); }
                    }
                }
                return { l1, l2 };
            }, [parsedData, time]);

            const doExport = useCallback(async () => {
                if (exporting) return;
                const t = duration || 10; if (t <= 0) { alert("请先加载媒体"); return; }
                setExporting(true); setShowExportModal(false);
                setExpProgress(0); setExpEta('初始化...'); cancelRef.current = false;
                console.log('[Export] 传递: parsedData.length=' + (parsedData?parsedData.length:0), 'config.indicatorEnabled=' + config.indicatorEnabled, 'entryBuf=' + entryBuf);
                await doExportCanvas({ w:expW, h:expH, fps:expFps, expCodec, expFormat, duration, totalTime:t, videoUrl, bgImageEnabled, bgImageUrl,
                    audioUrl, expAudioBitrate, expAudioSampleRate, expAudioChannels: 2,
                    parsedData, config, entryBuf,
                    parsedData, config, entryBuf,
                    setExpProgress, setExpEta, setExporting, cancelRef });
            }, [exporting, expW, expH, expFps, expCodec, expFormat, duration, videoUrl, bgImageEnabled, bgImageUrl,
                audioUrl, expAudioBitrate, expAudioSampleRate,
                parsedData, config, entryBuf]);

            const audioRef = useRef(null), videoRef = useRef(null), requestRef = useRef(null);
            const oldUrlsRef = useRef({ audio: null, video: null }); // 记录旧 URL 以便清理
            const timeRef = useRef(time); timeRef.current = time;
            const animate = useCallback(() => {
                const a = audioRef.current;
                const v = videoRef.current;
                const pageHidden = document.hidden;
                const audioPlaying = a && !a.paused && !a.ended;

                // ① 以 audio 为主时钟，驱动歌词时间
                if (audioPlaying) {
                    const ct = a.currentTime;
                    if (ct < a.duration || !a.duration) setTime(ct);
                } else if (a && a.ended && a.duration) {
                    // 音频结束：确保进度条跑到终点（最后一帧的 setTime 可能没覆盖到 duration）
                    setTime(a.duration);
                }

                // ② 同步 video 到 audio，并防御浏览器后台暂停
                if (v && v.readyState >= 2 && audioPlaying) {
                    // 防御性恢复：audio 在播但 video 被浏览器暂停了（切 tab 导致），页面可见时立即恢复
                    if (v.paused && !pageHidden) {
                        v.currentTime = a.currentTime;
                        v.play().catch(() => {});
                    } else if (!v.paused) {
                        // 正常同步：两者都在播放时微调
                        if (Math.abs(v.currentTime - a.currentTime) > 0.15) {
                            v.currentTime = a.currentTime;
                        }
                    }
                }

                requestRef.current = requestAnimationFrame(animate);
            }, []);
            useEffect(() => { requestRef.current = requestAnimationFrame(animate); return () => cancelAnimationFrame(requestRef.current); }, [animate]);

            // ③ visibilitychange：切回标签页时立即矫正所有状态（进度条/时间UI/video）
            useEffect(() => {
                const onVis = () => {
                    if (document.hidden) return;
                    const a = audioRef.current;
                    const v = videoRef.current;
                    if (!a) return;

                    // 同步进度条和时间显示 UI（rAF 在后台会被节流，切回时一次性追上）
                    setTime(a.currentTime);

                    if (!v || v.readyState < 2) return;

                    if (!a.paused && !a.ended) {
                        // audio 还在播 → seek 到位并恢复 video 播放
                        v.currentTime = a.currentTime;
                        v.play().catch(() => {});
                    } else if (a.ended) {
                        // audio 已结束 → video 也跳到结尾
                        v.currentTime = a.duration || a.currentTime;
                    }
                };
                document.addEventListener('visibilitychange', onVis);
                return () => document.removeEventListener('visibilitychange', onVis);
            }, []);

            const previewOuterRef = useRef(null);
            const [canvasScale, setCanvasScale] = useState(1);
            useEffect(() => {
                const c = () => {
                    if (!previewOuterRef.current) return;
                    const r = previewOuterRef.current.getBoundingClientRect();
                    const mobile = window.matchMedia('(max-width: 767px)').matches;
                    setCanvasScale(mobile
                        ? Math.min((r.width - 16) / 1280, 1)
                        : Math.min((r.width - 40) / 1280, (r.height - 160) / 720, 1));
                };
                c(); const ro = new ResizeObserver(c); if (previewOuterRef.current) ro.observe(previewOuterRef.current); return () => ro.disconnect();
            }, []);

            return (
                <div>
                    <div className="app-shell flex h-screen bg-zinc-950 text-white overflow-hidden font-sans text-sm">
                        <div className="app-sidebar w-80 bg-zinc-900 border-r border-zinc-800 p-6 flex flex-col gap-6 shadow-2xl z-20 overflow-y-auto custom-scrollbar flex-shrink-0">
                            <div className="app-header flex items-center gap-2 border-b border-zinc-800 pb-4">
                                <img src="/images/logo.png" alt="Logo" className="w-6 h-6" />
                                <h1 className="text-lg font-black uppercase tracking-tighter italic">Kirakara Player Demo</h1>
                            </div>
                            <div className="settings-panels space-y-3">
                                {/* 媒体资源 */}
                                <section className="space-y-2">
                                    <label className="text-[10px] font-bold text-zinc-500 uppercase flex items-center gap-2 tracking-widest">
                                        <Icons.Music className="w-3 h-3"/> 媒体资源
                                    </label>
                                    <div className="flex gap-2">
                                        <input type="file" accept="audio/*,video/*" className="flex-1 bg-zinc-800 p-1.5 rounded border border-zinc-700 text-[10px] file:mr-2 file:py-0.5 file:px-2 file:rounded file:border-0 file:text-[10px] file:bg-zinc-700 file:text-zinc-300"
                                            onChange={(e) => { const f=e.target.files[0]; if(!f)return;
                                                // 切换前：先彻底停止旧媒体，避免残留状态导致播放器宕机
                                                const a = audioRef.current, v = videoRef.current;
                                                if (a) { a.pause(); a.removeAttribute('src'); a.load(); }
                                                if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
                                                setIsPlaying(false); setTime(0);
                                                // 清理旧 blob URL 防止内存泄漏
                                                if (oldUrlsRef.current.audio && oldUrlsRef.current.audio.startsWith('blob:')) URL.revokeObjectURL(oldUrlsRef.current.audio);
                                                if (oldUrlsRef.current.video && oldUrlsRef.current.video.startsWith('blob:')) URL.revokeObjectURL(oldUrlsRef.current.video);
                                                const url=URL.createObjectURL(f);
                                                if(f.type.startsWith('video/')){setVideoUrl(url);setAudioUrl(url);setBgImageEnabled(false);oldUrlsRef.current={audio:url,video:url};}
                                                else{setVideoUrl(null);setAudioUrl(url);oldUrlsRef.current={audio:url,video:null};}
                                            }} />
                                        <button className="text-[10px] text-red-400 hover:text-red-300 px-1" onClick={()=>{
                                            const a=audioRef.current,v=videoRef.current;
                                            if(a){a.pause();a.removeAttribute('src');a.load();}
                                            if(v){v.pause();v.removeAttribute('src');v.load();}
                                            setIsPlaying(false); setTime(0);
                                            if(oldUrlsRef.current.audio&&oldUrlsRef.current.audio.startsWith('blob:'))URL.revokeObjectURL(oldUrlsRef.current.audio);
                                            if(oldUrlsRef.current.video&&oldUrlsRef.current.video.startsWith('blob:'))URL.revokeObjectURL(oldUrlsRef.current.video);
                                            oldUrlsRef.current={audio:null,video:null};
                                            setAudioUrl(null);setVideoUrl(null);
                                        }}>✕</button>
                                    </div>
                                    <textarea className="w-full h-36 bg-black p-2 font-mono text-[10px] rounded border border-zinc-700 focus:border-indigo-500 outline-none resize-none" value={lrcRaw} onChange={e=>setLrcRaw(e.target.value)} placeholder="@Ruby 或 春日向け 格式...&#13;&#10;歌词内使用【角色】以解析角色..." />
                                    <div className="flex items-center gap-2">
                                        <input ref={lrcFileInputRef} type="file" accept=".lrc,.txt" className="hidden" onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setLrcRaw(r.result||'');r.readAsText(f);}}/>
                                        <button className="text-[10px] text-indigo-400 hover:text-indigo-300 border border-zinc-700 rounded px-2 py-0.5" onClick={()=>lrcFileInputRef.current?.click()}>📄 载入 LRC 文件</button>
                                        {lrcRaw && <button className="text-[10px] text-zinc-500 hover:text-red-400" onClick={()=>setLrcRaw('')}>清空</button>}
                                    </div>
                                </section>

                                {/* 背景图片 */}
                                <section className="space-y-2 pt-3 border-t border-zinc-800">
                                    <label className="text-[10px] font-bold text-zinc-500 uppercase flex items-center gap-2 tracking-widest"><Icons.Image className="w-3 h-3"/> 背景图片</label>
                                    <label className="flex items-center gap-2 bg-zinc-800 rounded p-1.5 cursor-pointer">
                                        <input type="checkbox" checked={bgImageEnabled} onChange={e=>{const on=e.target.checked;setBgImageEnabled(on);if(on&&bgImageInputRef.current)bgImageInputRef.current.click();if(on&&videoUrl)setVideoUrl(null);if(!on)setBgImageUrl(null);}} className="accent-amber-500 w-3.5 h-3.5"/>
                                        <span className="text-[10px] text-zinc-300 flex-1">启用背景图片</span>
                                        {bgImageEnabled&&bgImageUrl&&<span className="text-[9px] text-amber-400 cursor-pointer px-1" onClick={e=>{e.stopPropagation();e.preventDefault();bgImageInputRef.current?.click();}}>换图</span>}
                                    </label>
                                    <input ref={bgImageInputRef} type="file" accept="image/*" className="hidden" onChange={e=>{const f=e.target.files[0];if(f)setBgImageUrl(URL.createObjectURL(f));}}/>
                                    {bgImageEnabled&&<div className="flex items-center gap-2 ml-2"><span className="text-[10px] text-zinc-500 w-10">透明度</span><input type="range" min="0" max="1" step="0.05" value={config.bgImageOpacity} onChange={e=>setConfig({...config,bgImageOpacity:parseFloat(e.target.value)})} className="flex-1 accent-amber-500 h-1"/><span className="text-[10px] text-zinc-500 w-8 text-right">{Math.round(config.bgImageOpacity*100)}%</span></div>}
                                </section>

                                {/* 字体排版 */}
                                <section className="space-y-2 pt-3 border-t border-zinc-800">
                                    <label className="text-[10px] font-bold text-zinc-500 uppercase flex items-center gap-2 tracking-widest"><Icons.Type className="w-3 h-3"/> 字体排版</label>
                                        <div className="flex items-stretch bg-zinc-800 rounded border border-zinc-700 focus-within:border-indigo-500 overflow-hidden">
                                            <input
                                                type="text"
                                                value={config.fontFamily}
                                                onChange={e => setConfig({...config, fontFamily: e.target.value})}
                                                placeholder="输入字体名…"

                                </div>
                            </div>
                            {exporting && <div className="export-overlay">
                                <div className="text-xs font-bold text-white mb-1.5 flex justify-between"><span>🎬 导出中 {expProgress}%</span>{expEta&&<span className="text-zinc-400 font-normal">{expEta}</span>}</div>
                                <div className="w-full bg-zinc-700 rounded-full h-2 overflow-hidden mb-3"><div className="bg-indigo-500 h-full rounded-full transition-all duration-300" style={{width:`${expProgress}%`}}/></div>
                                <button className="w-full text-xs text-zinc-400 hover:text-red-400 border border-zinc-700 hover:border-red-800 rounded-lg py-1.5 transition-colors" onClick={()=>{cancelRef.current=true;}}>✕ 取消导出</button>
                            </div>}
                        </div>
                        {!exporting && <button className={`export-fab${(duration>0||audioUrl)?'':' disabled'}`} title={duration>0||audioUrl?'导出视频':'请先加载音频或视频'} disabled={!(duration>0||audioUrl)} onClick={()=>setShowExportModal(true)}>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </button>}
                        {showExportModal && <div className="export-modal-backdrop" onClick={e=>{if(e.target===e.currentTarget)setShowExportModal(false)}}>
                            <div className="export-modal"><h2>🎬 导出视频</h2>
                                <div className="space-y-3" style={{marginTop:12}}>
                                    <div className="text-s text-zinc-400 font-semibold">视频设置</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label>容器格式</label><select value={expFormat} onChange={e=>{setExpFormat(e.target.value);setExpCodec(e.target.value==='mp4'?'h264':'vp9');}}><option value="mp4">MP4</option><option value="webm">WebM</option></select></div>
                                        <div><label>视频编码</label><select value={expCodec} onChange={e=>setExpCodec(e.target.value)}>{expFormat==='mp4'?<><option value="h264">H.264</option></>:<><option value="vp9">VP9</option><option value="vp8">VP8</option></>}</select></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label>分辨率</label><div className="flex items-center gap-1"><input type="number" value={expW} onChange={e=>{const r=e.target.value;setExpW(r===''?'':parseInt(r)||1920)}} onBlur={()=>{if(expW===''||expW<0)setExpW(1920)}} className="flex-1"/><span className="text-zinc-500">×</span><input type="number" value={expH} onChange={e=>{const r=e.target.value;setExpH(r===''?'':parseInt(r)||1080)}} onBlur={()=>{if(expH===''||expH<0)setExpH(1080)}} className="flex-1"/></div></div>
                                        <div><label>帧率 (FPS)</label><input type="number" value={expFps} onChange={e=>{const r=e.target.value;setExpFps(r===''?'':parseInt(r)||60)}} onBlur={()=>{if(expFps===''||expFps<0)setExpFps(60)}}/></div>
                                    </div>
                                    {audioUrl && <>
                                    <div className="text-s text-zinc-400 font-semibold">音频设置</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label>采样率</label><select value={expAudioSampleRate} onChange={e=>setExpAudioSampleRate(parseInt(e.target.value))}><option value={48000}>48000Hz</option><option value={44100}>44100Hz</option></select></div>
                                        <div><label>比特率</label><select value={expAudioBitrate} onChange={e=>setExpAudioBitrate(parseInt(e.target.value))}><option value={192}>192k</option><option value={128}>128k</option><option value={256}>256k</option></select></div>
                                    </div></>}
                                </div>
                                <div className="btn-row"><button className="btn btn-ghost" onClick={()=>setShowExportModal(false)}>取消</button><button className="btn btn-primary" onClick={doExport}>开始导出</button></div>
                                <div className="export-tips mt-3 text-xs text-zinc-400">{expFormat==='mp4'?'':''}</div>
                            </div>
                        </div>}
                        {showAllRoles && <div className="export-modal-backdrop" onClick={e=>{if(e.target===e.currentTarget)setShowAllRoles(false)}}>
                            <div className="roles-modal"><h2>🎨 全部角色配置</h2>
                                <div className="roles-row" style={{marginBottom:14}}>
                                    <input type="text" placeholder="新角色名（如 pink）…" id="new-role-input" style={{flex:1}}
                                        onKeyDown={e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v&&!(config.characterProfiles||{})[v]){setConfig({...config,characterProfiles:{...(config.characterProfiles||{}),[v]:{}}});e.target.value='';}}}} />
                                    <button className="btn btn-primary" style={{padding:'6px 16px',fontSize:12}}
                                        onClick={()=>{const inp=document.getElementById('new-role-input');const v=inp?.value?.trim();if(v&&!(config.characterProfiles||{})[v]){setConfig({...config,characterProfiles:{...(config.characterProfiles||{}),[v]:{}}});inp.value='';}}}>
                                        添加
                                    </button>
                                </div>
                                <div className="roles-scroll" style={{maxHeight:'55vh',overflowY:'auto',paddingRight:4}}>
                                    {Object.keys(config.characterProfiles||{}).length===0 && <div style={{textAlign:'center',color:'#71717a',fontSize:12,padding:20}}>暂无角色，上方输入添加</div>}
                                    {Object.entries(config.characterProfiles||{}).map(([roleName, profile]) => {
                                        const p = profile || {};
                                        const isActive = activeRoles.has(roleName);
                                        const updateRole = (patch) => setConfig({...config, characterProfiles:{...config.characterProfiles, [roleName]:{...p, ...patch}}});
                                        const delRole = () => { const np = {...config.characterProfiles}; delete np[roleName]; setConfig({...config, characterProfiles:np}); };
                                        const useImage = !!p.imageMode;
                                        return (
                                            <div key={roleName} className={`roles-card${isActive?'':' inactive'}`}>
                                                <div className="roles-card-header">
                                                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                                                        <span className="roles-card-title" style={{color:p.displayColor||p.colorBefore||config.colorBefore}}>{roleName}</span>
                                                        <label style={{display:'flex',alignItems:'center',gap:3,cursor:'pointer',fontSize:10,color:'#a1a1aa'}}>
                                                            <input type="checkbox" checked={!!p.showLabel} onChange={e => updateRole({ showLabel: e.target.checked || undefined })} /> 外显
                                                        </label>
                                                        <span className={`roles-badge${isActive?' active':' inactive'}`}>{isActive ? '歌词中' : '未使用'}</span>
                                                    </div>
                                                    {!isActive && <button className="btn-del" onClick={delRole}>✕ 删除</button>}
                                                </div>
                                                <div className="roles-row">
                                                    <button className={`chip${!useImage?' on':' off'}`} onClick={()=>updateRole({imageMode:undefined})}>文字</button>
                                                    <button className={`chip${useImage?' on':' off'}`} onClick={()=>updateRole({imageMode:true})}>图片</button>
                                                    {useImage
                                                        ? <div style={{display:'flex',alignItems:'center',gap:5,flex:1,background:'#27272a',border:'1px solid #3f3f46',borderRadius:6,padding:'2px 6px'}}>
                                                            <input type="file" accept="image/*" style={{display:'none'}} id={`all-img-file-${roleName}`}
                                                                onChange={e=>{const f=e.target.files[0];if(f)updateRole({image:URL.createObjectURL(f), imageName:f.name});}} />
                                                            <button className="chip off" style={{padding:'2px 6px',fontSize:10}}
                                                                onClick={()=>document.getElementById(`all-img-file-${roleName}`)?.click()}>📁 选择</button>
                                                            <span style={{fontSize:10,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:p.image?'#d4d4d8':'#71717a'}}>{p.imageName || (p.image ? '已选图' : '未选择')}</span>
                                                            {p.image && <button className="btn-del" onClick={()=>updateRole({image:undefined,imageName:undefined})}>✕</button>}
                                                        </div>
                                                        : <div style={{display:'flex',alignItems:'center',gap:4,flex:1}}>
                                                            <label>外显名</label>
                                                            <input type="text" value={p.displayName || ''} placeholder={roleName} style={{flex:1,minWidth:80}}
                                                                onChange={e => updateRole({ displayName: e.target.value })} />
                                                        </div>
                                                    }
                                                </div>
                                                <div className="roles-grid4">
                                                    {[['走字前','colorBefore'],['走字后','colorAfter'],['描边前','strokeColorBefore'],['描边后','strokeColorAfter']].map(([l,k]) =>
                                                        <div key={k}><label>{l}</label>
                                                            <input type="color" value={p[k] || config[k]}
                                                                onChange={e => updateRole({ [k]: e.target.value })} />
                                                        </div>
                                                    )}
                                                </div>
                                                {!useImage && <div className="roles-row">
                                                    <label>标签色</label><input type="color" value={p.displayColor||p.colorBefore||config.colorBefore} onChange={e=>updateRole({displayColor:e.target.value})} style={{width:36,height:24}} />
                                                    <label>标签描边</label><input type="color" value={p.labelStrokeColor||config.strokeColorBefore} onChange={e=>updateRole({labelStrokeColor:e.target.value})} style={{width:36,height:24}} />
                                                    <label>缩放%</label><input type="number" value={p.labelScale??100} step="5" min="10" max="300" style={{width:56}}
                                                        onChange={e=>{const r=e.target.value;updateRole({labelScale:r===''?'':parseInt(r)||100})}} onBlur={()=>{if(p.labelScale===''||p.labelScale<10)updateRole({labelScale:10})}} />
                                                </div>}
                                                {useImage && <div className="roles-row">
                                                    <label>Y偏移</label><input type="number" value={p.imageOffsetY||''} placeholder="0" step="1" style={{width:50}}
                                                        onChange={e=>{const r=e.target.value;updateRole({imageOffsetY:r===''?'':parseInt(r)||undefined})}} onBlur={()=>{if(p.imageOffsetY===''||p.imageOffsetY==null||isNaN(p.imageOffsetY))updateRole({imageOffsetY:0})}} />
                                                    <label>缩放%</label><input type="number" value={p.labelScale??100} step="5" min="10" max="300" style={{width:56}}
                                                        onChange={e=>{const r=e.target.value;updateRole({labelScale:r===''?'':parseInt(r)||100})}} onBlur={()=>{if(p.labelScale===''||p.labelScale<10)updateRole({labelScale:10})}} />
                                                    <label>左距</label><input type="number" value={p.labelMarginLeft||''} placeholder="0" step="1" style={{width:50}}
                                                        onChange={e=>{const r=e.target.value;updateRole({labelMarginLeft:r===''?'':parseInt(r)||undefined})}} onBlur={()=>{if(p.labelMarginLeft===''||p.labelMarginLeft==null||isNaN(p.labelMarginLeft))updateRole({labelMarginLeft:0})}} />
                                                    <label>右距</label><input type="number" value={p.labelMarginRight||''} placeholder="0" step="1" style={{width:50}}
                                                        onChange={e=>{const r=e.target.value;updateRole({labelMarginRight:r===''?'':parseInt(r)||undefined})}} onBlur={()=>{if(p.labelMarginRight===''||p.labelMarginRight==null||isNaN(p.labelMarginRight))updateRole({labelMarginRight:0})}} />
                                                </div>}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="btn-row" style={{marginTop:12}}><button className="btn btn-ghost" onClick={()=>setShowAllRoles(false)}>关闭</button></div>
                            </div>
                        </div>}
                    </div>
                    {/* key 强制 React 在 URL 变化时销毁旧元素、创建新元素，彻底避免媒体元素内部状态残留 */}
                    <audio key={audioUrl || 'no-audio'} ref={audioRef} src={audioUrl || undefined} onDurationChange={e=>setDuration(e.target.duration)} onPlay={()=>setIsPlaying(true)} onPause={()=>setIsPlaying(false)} onEnded={()=>setIsPlaying(false)}/>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
